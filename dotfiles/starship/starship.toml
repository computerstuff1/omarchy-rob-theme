add_newline = true
command_timeout = 2000
scan_timeout = 10

# Full showy layout:
#   line 1: identity + location + git (branch/status/metrics/state/commit) +
#           tool context + jobs/sudo/nesting
#   line 2: prompt character (blue = success, red = failure)
format = """$os$username$hostname$directory$git_branch$git_status$git_metrics$git_state$git_commit$nodejs$python$rust$golang$java$package$docker_context$kubernetes$terraform$aws$gcloud$jobs$sudo$shlvl$cmd_duration$fill$time
$character"""

[character]
success_symbol = "[](bold #4ade7f)"
error_symbol = "[](bold #d35f5f)"
vimcmd_symbol = "[](bold #d4953b)"

[os]
disabled = false
style = "bold #1793d1"
format = "[$symbol]($style) "
symbols = { Linux = "", Arch = "", Unknown = "" }

[username]
show_always = true
style_user = "bold #e0f2fe"
style_root = "bold #d35f5f"
format = "[$symbol$user@]($style)"

[hostname]
ssh_only = false
style = "bold #e0f2fe"
format = "[$symbol$hostname]($style) "

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold #1793d1"
read_only = " 󰌾"
read_only_style = "#6b6b6b"
format = "[$path]($style)[$read_only]($read_only_style)"

[git_branch]
style = "bold #2aa5cc"
format = " on [$symbol$branch]($style)"

[git_status]
style = "#6b6b6b"
format = "[$all_status$ahead_behind]($style)"
ahead = " ⇡${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"
behind = " ⇣${count}"
conflicted = " "
up_to_date = " "
untracked = " ?"
modified = " "
staged = " ＋"
renamed = " ›"
deleted = " "
stashed = ""

[git_metrics]
disabled = false
only_nonzero_diffs = true
added_style = "bold #2aa5cc"
deleted_style = "bold #d35f5f"
format = "([+$added]($added_style)[-$deleted]($deleted_style)) "

[git_state]
style = "bold #d4953b"
format = "[$state( $progress_current/$progress_total)]($style)"

[git_commit]
style = "italic #6b6b6b"
format = "[(\\($hash\\))]($style)"

[cmd_duration]
disabled = false
min_time = 2_000
style = "#6b6b6b"
format = " took [$duration]($style) "

[jobs]
style = "#6b6b6b"
threshold = 1
format = " [$symbol$number]($style)"

[status]
disabled = true
style = "bold #d35f5f"
symbol = ""
format = "[$symbol $status]($style) "

[sudo]
disabled = false
style = "bold #d4953b"
symbol = " "
format = "[$symbol]($style) "

[shlvl]
disabled = false
threshold = 2
style = "bold #6b6b6b"
symbol = "↳"
format = "[$symbol$shlvl]($style) "

[fill]
disabled = false
symbol = " "
style = "#1e1e1e"

[nodejs]
style = "#a78bfa"
format = "[  ($version )]($style)"

[python]
style = "#d4953b"
format = "[$symbol($version )]($style)"

[rust]
style = "#d4953b"
format = "[$symbol($version )]($style)"

[golang]
style = "#67c3ef"
format = "[$symbol($version )]($style)"

[java]
style = "#d4953b"
format = "[$symbol($version )]($style)"

[package]
style = "#a78bfa"
format = "[$symbol($version )]($style)"

[docker_context]
style = "#67c3ef"

[kubernetes]
style = "#67c3ef"
format = "[$symbol\\($context\\)]($style)"

[terraform]
style = "#a78bfa"

[aws]
style = "#d4953b"

[gcloud]
style = "#67c3ef"

[time]
disabled = false
time_format = "%I:%M %P"
style = "bold #e0f2fe"
format = "[$time]($style)"
