add_newline = true
command_timeout = 2000
scan_timeout = 10

# Full showy layout:
#   line 1: identity + location + git (branch/status/metrics/state/commit) +
#           tool context + jobs/sudo/nesting
#   line 2: prompt character (blue = success, red = failure)
format = """$os$username$hostname$directory$git_branch$git_status$git_metrics$git_state$git_commit$nodejs$python$rust$golang$java$package$docker_context$kubernetes$terraform$aws$gcloud$jobs$sudo$shlvl$cmd_duration$fill$time
$character"""

[character]
success_symbol = "[](bold #00a152)"
error_symbol = "[](bold #da2c20)"
vimcmd_symbol = "[](bold #fcec02)"

[os]
disabled = false
style = "bold #00a0e4"
format = "[$symbol]($style) "
symbols = { Linux = "", Arch = "", Unknown = "" }

[username]
show_always = true
style_user = "bold #d6d4d3"
style_root = "bold #da2c20"
format = "[$symbol$user@]($style)"

[hostname]
ssh_only = false
style = "bold #d6d4d3"
format = "[$symbol$hostname]($style) "

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold #00a0e4"
read_only = " 󰌾"
read_only_style = "#5b5b5b"
format = "[$path]($style)[$read_only]($read_only_style)"

[git_branch]
style = "bold #b5e4f4"
format = " on [$symbol$branch]($style)"

[git_status]
style = "#5b5b5b"
format = "[$all_status$ahead_behind]($style)"
ahead = " ⇡${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"
behind = " ⇣${count}"
conflicted = " "
up_to_date = " "
untracked = " ?"
modified = " "
staged = " ＋"
renamed = " ›"
deleted = " "
stashed = ""

[git_metrics]
disabled = false
only_nonzero_diffs = true
added_style = "bold #b5e4f4"
deleted_style = "bold #da2c20"
format = "([+$added]($added_style)[-$deleted]($deleted_style)) "

[git_state]
style = "bold #fcec02"
format = "[$state( $progress_current/$progress_total)]($style)"

[git_commit]
style = "italic #5b5b5b"
format = "[(\\($hash\\))]($style)"

[cmd_duration]
disabled = false
min_time = 2_000
style = "#5b5b5b"
format = " took [$duration]($style) "

[jobs]
style = "#5b5b5b"
threshold = 1
format = " [$symbol$number]($style)"

[status]
disabled = true
style = "bold #da2c20"
symbol = ""
format = "[$symbol $status]($style) "

[sudo]
disabled = false
style = "bold #fcec02"
symbol = " "
format = "[$symbol]($style) "

[shlvl]
disabled = false
threshold = 2
style = "bold #5b5b5b"
symbol = "↳"
format = "[$symbol$shlvl]($style) "

[fill]
disabled = false
symbol = " "
style = "#0d0d0d"

[nodejs]
style = "#a06994"
format = "[  ($version )]($style)"

[python]
style = "#fcec02"
format = "[$symbol($version )]($style)"

[rust]
style = "#fcec02"
format = "[$symbol($version )]($style)"

[golang]
style = "#b5e4f4"
format = "[$symbol($version )]($style)"

[java]
style = "#fcec02"
format = "[$symbol($version )]($style)"

[package]
style = "#a06994"
format = "[$symbol($version )]($style)"

[docker_context]
style = "#b5e4f4"

[kubernetes]
style = "#b5e4f4"
format = "[$symbol\\($context\\)]($style)"

[terraform]
style = "#a06994"

[aws]
style = "#fcec02"

[gcloud]
style = "#b5e4f4"

[time]
disabled = false
time_format = "%I:%M %P"
style = "bold #d6d4d3"
format = "[$time]($style)"
