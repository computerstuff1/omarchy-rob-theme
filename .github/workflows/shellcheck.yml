name: ShellCheck

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          curl -sSL "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz" \
            -o /tmp/shellcheck.tar.xz
          tar -xf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version

      - name: Run ShellCheck
        run: |
          shellcheck -x -s bash \
            install.sh \
            dotfiles/bin/system-update-count \
            dotfiles/hooks/rob-theme-repatch.sh
